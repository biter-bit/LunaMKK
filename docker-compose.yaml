services:
  pg:
    image: postgres:15
    restart: on-failure
    environment:
      POSTGRES_USER: $USERNAME_DB
      POSTGRES_PASSWORD: $PASSWORD_DB
      POSTGRES_DB: $NAME_DB
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pg_data:/var/lib/postgresql/data
  rabbit:
    image: rabbitmq:4.3-management
    ports:
      - "15672:15672"
    restart: on-failure
  api:
    build:
      context: .
      dockerfile: DockerfileAPI
    restart: on-failure
    ports:
      - "8000:8000"
    depends_on:
      - pg
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/health/live || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
  event_worker:
    extra_hosts:
      - "host.docker.internal:172.21.80.1"
    build:
      context: .
      dockerfile: DockerfileEWorker
    restart: on-failure
    depends_on:
      - pg
      - rabbit
  consumer:
    extra_hosts:
      - "host.docker.internal:172.21.80.1"
    build:
      context: .
      dockerfile: DockerfileConsumerWorker
    restart: on-failure
    depends_on:
      - pg
      - rabbit
volumes:
  pg_data: